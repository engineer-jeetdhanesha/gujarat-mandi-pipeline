bundle:
  name: gujarat-mandi-pipeline

include:
  - resources/*.yml

sync:
  exclude:
    - .vscode
    - .claude
    - docs
    - tests
    - pytest.ini
    - requirements-dev.txt

variables:
  file_path:
    description: >-
      Source CSV file or pattern for the bronze load. Each target sets its own landing volume; a file leaves the
      landing volume when mandi_daily has loaded it, so the pattern only ever matches files that wait to be loaded.
    default: ""

  warehouse_id:
    description: SQL warehouse that runs the dashboard queries, found by name in each workspace
    lookup:
      warehouse: Serverless Starter Warehouse
  catalog:
    description: Catalog of the environment, used by the dashboard queries (set per target)
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405617239301071.11.azuredatabricks.net
    variables:
      file_path: /Volumes/gujarat_mandi_pipeline_dev_ws/bronze/landing_zone/mandi_*.csv
      catalog: gujarat_mandi_pipeline_dev_ws

  uat:
    mode: production
    workspace:
      host: https://adb-7405618434508183.3.azuredatabricks.net
      root_path: /Workspace/Users/7b6c1128-258e-47a7-ab23-195029fb260c/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 7b6c1128-258e-47a7-ab23-195029fb260c
    variables:
      file_path: /Volumes/gujarat_mandi_pipeline_uat_ws/bronze/landing_zone/mandi_*.csv
      catalog: gujarat_mandi_pipeline_uat_ws
    permissions:
      - service_principal_name: 7b6c1128-258e-47a7-ab23-195029fb260c
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://adb-7405605581298117.17.azuredatabricks.net
      root_path: /Workspace/Users/47b5ebd0-4696-40d1-bd0a-02b71ce98a10/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 47b5ebd0-4696-40d1-bd0a-02b71ce98a10
    variables:
      file_path: /Volumes/gujarat_mandi_pipeline_prod_ws/bronze/landing_zone/mandi_*.csv
      catalog: gujarat_mandi_pipeline_prod_ws
    permissions:
      - service_principal_name: 47b5ebd0-4696-40d1-bd0a-02b71ce98a10
        level: CAN_MANAGE
