resources:
  dashboards:
    mandi_prices:
      display_name: Mandi prices
      file_path: ./dashboards/mandi_prices.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
      # Every workspace user can open the dashboard, but not edit it. Edits are made in the repo and deployed.
      permissions:
        - group_name: users
          level: CAN_READ
