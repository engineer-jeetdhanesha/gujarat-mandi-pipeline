resources:
  jobs:
    mandi_pipeline:
      name: mandi_pipeline
      max_concurrent_runs: 1
      timeout_seconds: 3600

      parameters:
        - name: run_id
          default: "{{job.run_id}}"
        - name: file_path
          default: ${var.file_path}

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/setup.ipynb

        - task_key: load_bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../src/load_bronze.ipynb
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              file_path: "{{job.parameters.file_path}}"
              fail_on_error: "true"

        - task_key: load_bronze_dims
          depends_on:
            - task_key: load_bronze
          notebook_task:
            notebook_path: ../src/load_bronze_dims.ipynb
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              fail_on_error: "true"

        - task_key: load_silver_dims
          depends_on:
            - task_key: load_bronze_dims
          notebook_task:
            notebook_path: ../src/load_silver_dims.ipynb
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              fail_on_error: "true"

        - task_key: load_silver_transactions
          depends_on:
            - task_key: load_silver_dims
          notebook_task:
            notebook_path: ../src/load_silver_transactions.ipynb
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              fail_on_error: "true"

        - task_key: load_silver_facts
          depends_on:
            - task_key: load_silver_transactions
          notebook_task:
            notebook_path: ../src/load_silver_facts.ipynb
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              fail_on_error: "true"

        - task_key: load_gold
          depends_on:
            - task_key: load_silver_facts
          notebook_task:
            notebook_path: ../src/load_gold.ipynb
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              fail_on_error: "true"
