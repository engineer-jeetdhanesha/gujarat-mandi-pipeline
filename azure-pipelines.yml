# Azure Pipelines definition for the Gujarat mandi bundle.
# CI checks every change. Deploy UAT runs after a merge to main. The prod stage is added in a later commit.

# When does a run start?
trigger:                      # on a push ...
  branches:
    include: [main]           # ... to main (after a merge)
  tags:
    include: ['v*']           # ... of a release tag such as v1.0.0
pr:                           # on a pull request ...
  branches:
    include: [main]           # ... that targets main

# Choices shown when you start a run by hand ("Run pipeline"). Automatic runs use the default.
parameters:
  - name: runSetup
    displayName: Run mandi_setup in UAT before mandi_daily (tick it when the schema changes)
    type: boolean
    default: false

# Which machine runs the steps? A fresh Microsoft-hosted Linux VM for every run.
pool:
  vmImage: ubuntu-24.04

variables:
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip   # pip keeps downloaded packages here
  DATABRICKS_CLI_VERSION: 1.18.0              # pinned, so a new CLI release cannot change a run

stages:
  - stage: CI
    displayName: CI
    jobs:
      - job: test
        displayName: Lint and unit tests
        timeoutInMinutes: 30                  # a stuck Spark session must not hang the run
        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3.12
            inputs:
              versionSpec: '3.12'

          # Restore the pip cache from an earlier run; it is saved again when this run succeeds.
          # The key changes when requirements-dev.txt changes, which starts a fresh cache.
          - task: Cache@2
            displayName: Cache pip packages
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements-dev.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
            displayName: Install dependencies

          # Cheapest check first: finds unused or undefined names and unsorted imports in about a second.
          - script: ruff check src/lib_mandi tests/unit
            displayName: Lint (ruff)

          # Spark needs Java; Microsoft-hosted images already contain Java 17.
          # --junitxml writes a result file that the next step shows in the Tests tab.
          - script: |
              if [ -n "${JAVA_HOME_17_X64:-}" ]; then
                export JAVA_HOME="$JAVA_HOME_17_X64"
                export PATH="$JAVA_HOME/bin:$PATH"
              fi
              java -version
              pytest tests/unit --junitxml="$(Build.ArtifactStagingDirectory)/unit-test-results.xml"
            displayName: Unit tests (pytest, local Spark and Delta)

          # condition: succeededOrFailed() publishes the results even when a test failed, which is when they matter.
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/unit-test-results.xml'
              testRunTitle: Unit tests

      # Runs in parallel with "test" on its own VM. It signs in to Databricks as the UAT service principal
      # (service connection sc-mandi-uat) and asks the bundle to validate itself against the UAT workspace.
      # This catches a wrong id, a bad path or a permission mismatch before anything is deployed.
      - job: validate
        displayName: Validate bundle (uat)
        timeoutInMinutes: 10
        steps:
          - template: azure-pipelines/templates/install-databricks-cli.yml

          # AzureCLI@2 signs in to Azure as the service connection's identity, with no stored secret, and then
          # runs the script. DATABRICKS_AUTH_TYPE=azure-cli makes the Databricks CLI reuse that sign-in.
          # The workspace address comes from the "uat" target in databricks.yml.
          - task: AzureCLI@2
            displayName: Validate bundle (uat)
            inputs:
              azureSubscription: sc-mandi-uat
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                export DATABRICKS_AUTH_TYPE=azure-cli
                databricks --version
                databricks bundle validate -t uat

  # Runs only for a push to main (a merged PR) and only if CI passed. A PR or a tag run skips it.
  - stage: DeployUAT
    displayName: Deploy UAT
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      # The sample file that mandi_daily reads; upload it to the UAT landing volume once and adjust the name here.
      UAT_SOURCE_FILE: /Volumes/gujarat_mandi_pipeline_uat_ws/bronze/landing_zone/mandi_sample.csv
    jobs:
      # A "deployment" job is tied to an environment (uat), which keeps a history of what was deployed and
      # is where approvals and checks can be added later.
      - deployment: deploy_uat
        displayName: Deploy bundle to UAT and run it
        environment: uat
        timeoutInMinutes: 90
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self        # a deployment job does not fetch the code by itself

                - template: azure-pipelines/templates/install-databricks-cli.yml

                # Upload the bundle (notebooks, library, job definitions) to UAT and create or update the jobs.
                - task: AzureCLI@2
                  displayName: Deploy bundle (uat)
                  inputs:
                    azureSubscription: sc-mandi-uat
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      export DATABRICKS_AUTH_TYPE=azure-cli
                      databricks bundle deploy -t uat

                # Only when the runSetup box was ticked. "bundle run" waits for the job and fails the step
                # (and so the run) when the job fails.
                - ${{ if eq(parameters.runSetup, true) }}:
                    - task: AzureCLI@2
                      displayName: Run mandi_setup (uat)
                      inputs:
                        azureSubscription: sc-mandi-uat
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          export DATABRICKS_AUTH_TYPE=azure-cli
                          databricks bundle run mandi_setup -t uat

                # The end-to-end check of the new code: bronze, silver, facts and gold for the sample file.
                - task: AzureCLI@2
                  displayName: Run mandi_daily (uat)
                  inputs:
                    azureSubscription: sc-mandi-uat
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      export DATABRICKS_AUTH_TYPE=azure-cli
                      databricks bundle run mandi_daily -t uat --params file_path=$(UAT_SOURCE_FILE)
